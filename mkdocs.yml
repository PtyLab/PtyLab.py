site_name: PtyLab.py
site_description: Cross-platform, open-source inverse modeling toolbox for conventional and Fourier ptychography
site_url: https://ptylab.github.io/PtyLab.py/
repo_url: https://github.com/PtyLab/PtyLab.py
repo_name: PtyLab/PtyLab.py
dev_addr: '127.0.0.1:8000'

theme:
  name: material
  variant: modern
  logo: assets/ptylab_logo.svg
  favicon: assets/ptylab_logo.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - CPM Overview: cpm/overview.md
    - FPM Overview: fpm/overview.md
    - Data Format: cpm/data-format.md
    - Engines: cpm/engines.md
    - Configuration Reference: cpm/configuration.md
    - Differentiable Ptychography: differentiable/overview.md
  - Tutorials:
    - tutorials/index.md
    - "01 – CPM Simulation": tutorials/tutorial_CPM_sim.md
    - "02 – CPM Example Data": tutorials/tutorial_CPM.md
    - "03 – FPM Example Data": tutorials/tutorial_FPM.md
    - "04 – CPM Mixed States": tutorials/tutorial_mixedStates.md
    - "05 – CPM Multi-Slice": tutorials/tutorial_multiSlice.md
    - "06 – CPM Multi-Wavelength": tutorials/tutorial_CPM_multiWavelength.md
    - "07 – CPM Position Correction": tutorials/tutorial_LateralPositionCorrection.md
    - "08 – CPM Purity-Based Calibration": tutorials/tutorial_purityCalibration.md
    - "09 – CPM Reflection": tutorials/tutorial_reflectionPtychography.md
    - "10 – CPM Interferometric Intensity": tutorials/tutorial_interferometricIntensityConstraint.md
    - "11 – Scan Grids": tutorials/tutorial_scanGrids.md
    - "12 – CPM Orthogonal Probe Relaxation": tutorials/tutorial_OPR.md
    - "13 – CPM Differentiable Ptychography": tutorials/tutorial_differentiablePtychography.md
  - Contributing: contributing.md
  - API Reference:
    - api/index.md
    - Core: api/core.md
    - Engines: api/engines.md
    - Gradient Engine: api/gradient-engine.md
    - Experimental Data: api/experimental-data.md
    - Grid Generation: api/grid-generation.md
    - Monitoring: api/monitoring.md
    - Operators: api/operators.md
    - Parameters: api/parameters.md
    - Probe Engines: api/probe-engines.md
    - Reconstruction: api/reconstruction.md
    - Regularizers: api/regularizers.md
    - Input and Output: api/io.md
    - Utilities: api/utilities.md

extra_css:
  - stylesheets/extra.css

# MathJax renders the $...$ and $$...$$ maths in the TeX fonts of papers and textbooks.
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - attr_list
  
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            show_root_heading: true
            show_source: true
            members_order: source
            docstring_options:
              returns_named_value: false
