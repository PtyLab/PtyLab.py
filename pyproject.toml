[project]
name = "ptylab"
version = "0.4.0"
description = "A cross-platform, open-source inverse modeling toolbox for conventional and Fourier ptychography"
authors = [
    { name = "Lars Loetgering", email = "lars.loetgering@fulbrightmail.org" },
    { name = "PtyLab Team" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy~=2.0",
    "matplotlib~=3.7",
    "h5py~=3.9",
    "scipy~=1.11",
    "scikit-image>=0.21.0",
    "tqdm~=4.65",
    "scikit-learn~=1.3",
    "ipywidgets>=8.1.8",
    "torch>=2.6",
]

[project.optional-dependencies]
gui = [
    "pyqtgraph>=0.13",
    "PySide6-Essentials>=6.2",  # only QtCore/QtGui/QtWidgets
]
# GPU support (CuPy) for the CUDA major version of the driver. The `ctk` extra
# (pip CUDA libraries) exists from CuPy 14 on.
cuda12 = ["cupy-cuda12x[ctk]>=14; sys_platform != 'darwin'"]
cuda13 = ["cupy-cuda13x[ctk]>=14; sys_platform != 'darwin'"]

# `uv sync` installs the `dev` group by default; `docs` is opt-in with `--group docs`.
[dependency-groups]
dev = [
    "ptylab[gui]",  # Qt viewer for contributors; pip users opt in with the extra
    "ruff>=0.16",
    "pytest~=9.0",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbclient>=0.10",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.8",
    "zensical>=0.0.71",
]

[project.scripts]
ptylab = "PtyLab.utils.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "PtyLab"
module-root = ""

[tool.uv]
# CuPy and PyTorch share the pip CUDA libraries (`cuda-toolkit`), so the two
# CUDA extras cannot share an environment, and the resolver picks a PyTorch
# build for the same CUDA major version. A uv source switching the PyTorch
# index per extra is not possible here: torch is a core dependency, and uv then
# applies that index on macOS too, where no CUDA builds exist.
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
