[project]
name = "ptylab"
version = "0.3.4"
description = "A cross-platform, open-source inverse modeling toolbox for conventional and Fourier ptychography"
authors = [
    { name = "Lars Loetgering", email = "lars.loetgering@fulbrightmail.org" },
    { name = "PtyLab Team" },
]
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "numpy~=2.0",
    "matplotlib~=3.7",
    "h5py~=3.9",
    "scipy~=1.11",
    "scikit-image>=0.21.0",
    "tqdm~=4.65",
    "scikit-learn~=1.3",
    "ipython~=8.18",
    "ipywidgets>=8.1.8",
]

[project.optional-dependencies]
gui = [
    "pyqtgraph>=0.13",
    "PySide6-Essentials>=6.2",  # only QtCore/QtGui/QtWidgets
]
gpu = ["cupy-cuda12x[ctk]; sys_platform != 'darwin'"]
torch = ["torch>=2.6"]

# `uv sync` installs the `dev` group by default; `docs` is opt-in with `--group docs`.
[dependency-groups]
dev = [
    "ruff>=0.16",
    "ipykernel~=6.25",
    "pytest~=9.0",
]
docs = [
    "jetblack-markdown",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-jupyter>=0.24",
    "mkdocstrings[python]>=1.0.6",
]

[project.scripts]
ptylab = "PtyLab.utils.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "PtyLab"
module-root = ""

# CUDA builds also run on CPUs; keep Torch compatible with the CUDA 12 CuPy extra.
# macOS uses the standard PyPI build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
