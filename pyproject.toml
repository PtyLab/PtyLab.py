[project]
name = "ptylab"
version = "0.4.0"
description = "A cross-platform, open-source inverse modeling toolbox for conventional and Fourier ptychography"
authors = [
    { name = "Lars Loetgering", email = "lars.loetgering@fulbrightmail.org" },
    { name = "PtyLab Team" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy~=2.0",
    "matplotlib~=3.7",
    "h5py~=3.9",
    "scipy~=1.11",
    "scikit-image>=0.21.0",
    "tqdm~=4.65",
    "scikit-learn~=1.3",
    "ipywidgets>=8.1.8",
    "torch>=2.6",
]

[project.optional-dependencies]
gui = [
    "pyqtgraph>=0.13",
    "PySide6-Essentials>=6.2",  # only QtCore/QtGui/QtWidgets
]
# GPU support (CuPy, CUDA 12). CUDA 12 builds also run on CUDA 13 drivers. The
# `ctk` extra (pip CUDA libraries) exists from CuPy 14 on.
gpu = ["cupy-cuda12x[ctk]>=14; sys_platform != 'darwin'"]

# `uv sync` installs the `dev` group by default; `docs` is opt-in with `--group docs`.
[dependency-groups]
dev = [
    "ptylab[gui]",  # Qt viewer for contributors; pip users opt in with the extra
    "ruff>=0.16",
    "pytest~=9.0",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbclient>=0.10",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.8",
    "zensical>=0.0.71",
]

[project.scripts]
ptylab = "PtyLab.utils.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "PtyLab"
module-root = ""

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# PyTorch uses the same `cuda-toolkit` as CuPy, so it must be a CUDA 12 build too.
# PyPI only has CUDA 13 builds of recent PyTorch, so take it from the PyTorch
# cu126 index (Linux and Windows; macOS has no CUDA and stays on PyPI). The same
# PyTorch is then locked with and without the `gpu` extra, so a plain `uv run`
# never swaps it.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
